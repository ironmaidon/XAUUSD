[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "btc-delta-option-seller"
version = "0.1.0"
description = "Safety-first BTC options research and execution platform for Delta Exchange India"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "structlog>=24.2,<26",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1", "ruff>=0.6,<1", "types-PyYAML>=6.0,<7"]

[project.scripts]
bos = "bos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bos"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bos"]
